<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuniLika — Мои ссылки</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  :root{
    --bg-dark:#1a0033;
    --bg-mid:#2b0a4e;
    --purple:#7a1fd0;
    --purple-lt:#b48aff;
    --hot:#e0d4ff;
    --text:#e0d4ff;
    --win-face:#3d2458;
    --win-light:#6b4a8a;
    --win-shadow:#0d0018;
    --win-dark-edge:#1f0d33;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    background-color:var(--bg-dark);
    background-image:
      repeating-linear-gradient(0deg, transparent 0 15px, rgba(122,31,208,.07) 15px 16px),
      repeating-linear-gradient(90deg, transparent 0 15px, rgba(122,31,208,.07) 15px 16px),
      radial-gradient(circle at 50% 20%, #34105e 0%, #1a0033 60%, #0d0018 100%);
    font-family:'Press Start 2P', 'MS Sans Serif', cursive;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:16px;
    image-rendering:pixelated;
  }

  /* ---------- fake CRT scanlines ---------- */
  body::after{
    content:"";
    position:fixed; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 2px, transparent 2px 4px);
    pointer-events:none;
    z-index:999;
  }

  /* ---------- window (Win9x/2000 style) ---------- */
  .window{
    width:100%; max-width:520px;
    background:var(--win-face);
    border:2px solid;
    border-color:var(--win-light) var(--win-shadow) var(--win-shadow) var(--win-light);
    box-shadow:0 0 0 1px var(--win-dark-edge), 8px 8px 0 rgba(0,0,0,.45), 0 0 40px rgba(122,31,208,.35);
    padding:3px;
  }

  .titlebar{
    background:linear-gradient(90deg, #2b0a4e 0%, var(--purple) 55%, #4b1480 100%);
    color:#fff;
    font-size:10px;
    padding:5px 6px;
    display:flex;
    align-items:center;
    gap:6px;
    user-select:none;
  }
  .titlebar .icon{ width:14px; height:14px; flex:0 0 auto; }
  .titlebar .title{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; letter-spacing:1px; }

  .tb-btns{ display:flex; gap:3px; }
  .tb-btn{
    width:18px; height:16px;
    background:var(--win-face);
    border:1px solid;
    border-color:var(--win-light) var(--win-shadow) var(--win-shadow) var(--win-light);
    color:var(--text);
    font-family:inherit; font-size:8px;
    line-height:1;
    cursor:default;
  }

  .content{ padding:14px 12px 12px; }

  h1{
    font-size:14px;
    text-align:center;
    color:var(--purple-lt);
    text-shadow:2px 2px 0 var(--win-shadow), 0 0 12px rgba(180,138,255,.6);
    margin:8px 0 4px;
    line-height:1.6;
  }
  .subtitle{
    text-align:center;
    font-size:8px;
    color:var(--hot);
    margin-bottom:14px;
    line-height:1.8;
  }

  /* ---------- links as Win buttons ---------- */
  .links{ display:flex; flex-direction:column; gap:8px; }
  a.link{
    display:flex; align-items:center; gap:10px;
    background:var(--win-face);
    border:2px solid;
    border-color:var(--win-light) var(--win-shadow) var(--win-shadow) var(--win-light);
    padding:11px 12px;
    color:var(--text);
    text-decoration:none;
    font-size:10px;
    letter-spacing:1px;
    line-height:1.6;
  }
  a.link .glyph{
    width:16px; height:16px; flex:0 0 auto;
    font-size:14px; text-align:center; line-height:16px;
    color:var(--purple-lt);
  }
  a.link .name{ flex:1; }
  a.link .arrow{ color:var(--purple-lt); font-size:8px; }
  a.link:hover{
    background:#4b2a6b;
    color:#fff;
    box-shadow:0 0 14px rgba(122,31,208,.6);
  }
  a.link:active{
    border-color:var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
    padding:12px 11px 10px 13px;
  }
  a.link.placeholder{ opacity:.55; }

  /* ---------- status bar ---------- */
  .statusbar{
    margin-top:12px;
    border:2px solid;
    border-color:var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
    background:#241040;
    font-size:8px;
    padding:4px 6px;
    display:flex;
    gap:8px;
    color:#a98ad0;
  }
  .statusbar .cell{ flex:1; }
  .statusbar .cell.counter{ flex:0 0 auto; }

  .cursor{ animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---------- start taskbar ---------- */
  .taskbar{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--win-face);
    border-top:2px solid var(--win-light);
    padding:3px 4px;
    display:flex; align-items:center; gap:6px;
    font-size:9px;
    z-index:998;
    user-select:none;
  }
  .start{
    background:var(--win-face);
    border:2px solid;
    border-color:var(--win-light) var(--win-shadow) var(--win-shadow) var(--win-light);
    padding:4px 8px;
    color:var(--text);
    cursor:default;
  }
  .start:active{
    border-color:var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
  }
  .clock{
    margin-left:auto;
    border:2px solid;
    border-color:var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
    padding:4px 8px;
    color:#a98ad0;
  }
  body{ padding-bottom:44px; }

  /* ---------- popup menu ---------- */
  .menu{
    position:fixed; bottom:34px; left:4px;
    background:var(--win-face);
    border:2px solid;
    border-color:var(--win-light) var(--win-shadow) var(--win-shadow) var(--win-light);
    padding:2px;
    display:none;
    z-index:997;
    min-width:170px;
  }
  .menu.open{ display:block; }
  .menu div{
    padding:7px 10px;
    font-size:9px;
    cursor:pointer;
  }
  .menu div:hover{ background:var(--purple); color:#fff; }

  /* ---------- clock is clickable ---------- */
  .clock{ cursor:pointer; }
  .clock:hover{ color:#fff; }

  /* ---------- "Свойства: Дата и время" ---------- */
  .dt-panel{
    position:fixed; right:4px; bottom:40px; z-index:997;
    width:260px;
    background:var(--win-face);
    border:2px solid;
    border-color:var(--win-light) var(--win-shadow) var(--win-shadow) var(--win-light);
    box-shadow:4px 4px 0 rgba(0,0,0,.45);
    padding:3px;
    display:none;
  }
  .dt-panel.open{ display:block; }
  .dt-body{ padding:10px 8px 12px; font-size:8px; line-height:1.8; }
  .dt-group{ font-size:9px; color:var(--text); }
  .dt-face{
    background:#10051f;
    border:2px solid;
    border-color:var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
    text-align:center;
    padding:10px 0 9px;
    margin:6px 0 12px;
  }
  .dt-time{ font-size:16px; color:var(--purple-lt); text-shadow:2px 2px 0 var(--win-shadow); }
  .dt-date{ margin-top:7px; color:#a98ad0; }
  .dt-val{ margin-top:4px; margin-bottom:2px; color:#a98ad0; }
  .dt-ok{
    display:block; margin:14px auto 0;
    background:var(--win-face);
    border:2px solid;
    border-color:var(--win-light) var(--win-shadow) var(--win-shadow) var(--win-light);
    padding:5px 22px;
    font-family:inherit; font-size:8px;
    color:var(--text);
    cursor:default;
  }
  .dt-ok:active{ border-color:var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow); }

  /* ---------- мемный курсор: пиксельный демон ---------- */
  html, body, a, .link, .menu div, .tb-btn, .clock, .dt-ok, .titlebar, .taskbar{
    cursor:var(--dcur, default);
  }
</style>
</head>
<body>

  <div class="window">
    <div class="titlebar">
      <svg class="icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect x="1" y="1" width="14" height="14" fill="#7a1fd0"/>
        <rect x="3" y="3" width="10" height="10" fill="#1a0033"/>
        <rect x="5" y="5" width="6" height="6" fill="#b48aff"/>
        <rect x="7" y="7" width="2" height="2" fill="#7a1fd0"/>
      </svg>
      <span class="title">KuniLika — C:\LINKS\</span>
      <div class="tb-btns">
        <div class="tb-btn">_</div>
        <div class="tb-btn">□</div>
        <div class="tb-btn">×</div>
      </div>
    </div>

    <div class="content">
      <h1>✦ KUNILIKA ✦</h1>
      <p class="subtitle">нажмите any key… но any key нигде нет<br>est. 666<span class="cursor">_</span></p>

      <div class="links" id="links"></div>

      <div class="statusbar">
        <div class="cell">Для запуска нажмите на ссылку</div>
        <div class="cell counter">👁 <span id="hits">0</span> хитов</div>
      </div>
    </div>
  </div>

  <div class="taskbar">
    <div class="start" id="startBtn">🖥 Пуск</div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="menu" id="menu">
    <div onclick="location.reload()">Перезагрузить</div>
    <div onclick="alert('Нигде в интернете!')">Обнаружить в инете</div>
    <div onclick="alert('Память: 640K хватит всем')">Помощь</div>
    <hr style="border:none;border-top:1px solid var(--win-shadow);border-bottom:1px solid var(--win-light);margin:4px 2px">
    <div id="sndItem">Звук: ВКЛ ♪</div>
  </div>

  <div class="dt-panel" id="dtProp">
    <div class="titlebar">
      <svg class="icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="12" height="12" fill="#b48aff"/>
        <rect x="4" y="4" width="8" height="8" fill="#1a0033"/>
        <rect x="7" y="1" width="2" height="3" fill="#fff"/>
        <rect x="12" y="7" width="3" height="2" fill="#fff"/>
      </svg>
      <span class="title">Свойства: Дата и время</span>
      <div class="tb-btns"><div class="tb-btn">×</div></div>
    </div>
    <div class="dt-body">
      <div class="dt-group">Ваше локальное время</div>
      <div class="dt-face">
        <div class="dt-time" id="dtTime">--:--:--</div>
        <div class="dt-date" id="dtDate">—</div>
      </div>
      <div class="dt-group">Часовой пояс</div>
      <div class="dt-val" id="dtZone">—</div>
      <button class="dt-ok" type="button">ОК</button>
    </div>
  </div>

<script>
// ===== ССЫЛКИ: меняй только этот список =====
// [название, glyph-эмодзи, url] — url '' = заглушка
const LINKS = [
  ["Telegram",   "✈",  "https://t.me/Kunilika_666"],
  ["YouTube",    "▶",  "https://www.youtube.com/@KuniLika666"],
  ["Twitch",     "🎮", "https://www.twitch.tv/kunyanyasha"],
  ["Steam",      "🕹", "https://steamcommunity.com/profiles/76561199215422251/"],
  ["GitHub",     "🐙", "https://github.com/KuniLika69"],
  ["Boosty",     "💜", "https://boosty.to/kunilika911"],
  ["Fetta",      "🍇", "https://fetta.app/u/kunilika666"],
  ["Donatex",    "💰", "https://donatex.gg/donate/kunilika666"],
  ["Lolka",      "🪙", "https://lolka.gg/coCChlvRO"],
  ["MemeAlerts", "👾", "https://memealerts.com/65ec3cefbe8bed46c74bd4a2"],
];
// ============================================

const box = document.getElementById("links");
for (const [name, glyph, url] of LINKS) {
  const a = document.createElement("a");
  a.className = "link" + (url ? "" : " placeholder");
  a.innerHTML = '<span class="glyph">' + glyph + '</span>' +
                '<span class="name">' + name + '</span>' +
                '<span class="arrow">' + (url ? "►" : "—") + '</span>';
  if (url) { a.href = url; a.target = "_blank"; a.rel = "noopener"; }
  else { a.href = "#"; a.onclick = () => { alert(name + ": ссылка не настроена"); return false; }; }
  box.appendChild(a);
}

// счётчик "хитов" из localStorage (2000s style)
let hits = parseInt(localStorage.getItem("hits") || "0", 10) + 1;
localStorage.setItem("hits", hits);
document.getElementById("hits").textContent = hits;

// часы в трее — время гостя, тикают каждую секунду
const WD = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const p = n => String(n).padStart(2, "0");
function zoneLabel(d){
  const off = -d.getTimezoneOffset();
  const sign = off < 0 ? "-" : "+";
  const abs = Math.abs(off);
  let s = "UTC" + sign + Math.floor(abs / 60);
  if (abs % 60) s += ":" + p(abs % 60);
  try { s += " · " + Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) {}
  return s;
}
const clockEl = document.getElementById("clock");
const dt = document.getElementById("dtProp");
function tick(){
  const d = new Date();
  const t = p(d.getHours()) + ":" + p(d.getMinutes());
  clockEl.textContent = t;
  clockEl.title = WD[d.getDay()] + ", " + d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear() + " г. · " + t + ":" + p(d.getSeconds());
  if (dt.classList.contains("open")) {
    document.getElementById("dtTime").textContent = t + ":" + p(d.getSeconds());
    document.getElementById("dtDate").textContent = WD[d.getDay()] + ", " + d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear() + " г.";
    document.getElementById("dtZone").textContent = zoneLabel(d);
  }
}
tick(); setInterval(tick, 1000);

// окно "Свойства: Дата и время" — по клику на часы, как в Windows 2000
clockEl.onclick = e => { e.stopPropagation(); dt.classList.toggle("open"); };
dt.addEventListener("click", e => e.stopPropagation());
const dtClose = () => dt.classList.remove("open");
document.querySelector(".dt-ok").onclick = dtClose;
dt.querySelector(".tb-btn").onclick = dtClose;

// меню "Пуск"
const menu = document.getElementById("menu");
document.getElementById("startBtn").onclick = e => { e.stopPropagation(); menu.classList.toggle("open"); };
document.addEventListener("click", () => menu.classList.remove("open"));
document.addEventListener("keydown", e => { if (e.key === "Escape") { menu.classList.remove("open"); dtClose(); } });

// звук: механический клац клавиатуры — синтез Web Audio, файлов нет
let actx = null;
let sndOn = localStorage.getItem("snd") !== "off";
function clack(){
  if (!sndOn) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t = actx.currentTime;
    const len = Math.floor(actx.sampleRate * 0.03);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const src = actx.createBufferSource(); src.buffer = buf;
    const hpf = actx.createBiquadFilter(); hpf.type = "highpass"; hpf.frequency.value = 1800;
    const ng = actx.createGain(); ng.gain.value = 0.3;
    src.connect(hpf); hpf.connect(ng); ng.connect(actx.destination);
    src.start(t);
    const osc = actx.createOscillator(); osc.type = "square";
    osc.frequency.setValueAtTime(1600, t);
    osc.frequency.exponentialRampToValueAtTime(500, t + 0.04);
    const og = actx.createGain();
    og.gain.setValueAtTime(0.09, t);
    og.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    osc.connect(og); og.connect(actx.destination);
    osc.start(t); osc.stop(t + 0.06);
  } catch (e) {}
}
document.addEventListener("pointerdown", clack);
const sndItem = document.getElementById("sndItem");
function paintSnd(){ sndItem.textContent = "Звук: " + (sndOn ? "ВКЛ ♪" : "ВЫКЛ"); }
sndItem.onclick = e => {
  e.stopPropagation();
  sndOn = !sndOn;
  localStorage.setItem("snd", sndOn ? "on" : "off");
  paintSnd(); clack();
};
paintSnd();

// мемный курсор: пиксельный демон, моргает, при нажатии бьёт когтями
const PAL = { o:"#ff8814", y:"#ffd21f", r:"#d02028", k:"#7a1018", w:"#ffffff", t:"#ff5f7a", 1:"#0a0a0a", p:"#141414" };
const C0 = [
"oy1.......1y1o..",
".oy1.....1yo....",
"..oy1...1yo.....",
"..1yy111yy1.....",
"..1rrrrrrrr1....",
".1rrrrrrrrr1....",
".1ryyr1ryyr1....",
".1rypr1rypr1....",
".1rrrrrrrrrr1...",
".1rwrwrwrwrw1...",
".1rwtrwtrwtr1...",
"..1rrrrrrrr1....",
".1r1rrrrr1r1....",
".11.1rrr1.11....",
".....1rrr1......",
"......o1o......."
];
const C1 = [
"oy1.......1y1o..",
".oy1.....1yo....",
"..oy1...1yo.....",
"..1yy111yy1.....",
"..1rrrrrrrr1....",
".1rrrrrrrrr1....",
".1rrrk1krrr1....",
".1rrrrrrrrrr1...",
".1rrrrrrrrrr1...",
".1rwrwrwrwrw1...",
".1rwtrwtrwtr1...",
"..1rrrrrrrr1....",
".1r1rrrrr1r1....",
".11.1rrr1.11....",
".....1rrr1......",
"......o1o......."
];
const C2 = [
"w1y1.....1y1o...",
"wwy1.....1yo....",
"wow1....1yo.....",
".w1yy111yy1.....",
"..1rrrrrrrr1....",
".1rrrrrrrrr1....",
".1ryyr1ryyr1....",
".1rypr1rypr1....",
".1rrrrrrrrrr1...",
".1rrwww11wwrr1..",
".1rrwtrwtrwrr1..",
".1rrrwtrtwrrr1..",
"..1rrrrrrrr1....",
".1r1rrrrr1r1....",
".11.1rrr1.11....",
".....1o1o......."
];
function cur(rows){
  let s = '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">';
  rows.forEach((row, y) => {
    for (let x = 0; x < 16; x++) {
      const c = row[x];
      if (c !== "." && PAL[c]) s += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + PAL[c] + '"/>';
    }
  });
  return 'url("data:image/svg+xml,' + encodeURIComponent(s + "</svg>") + '") 1 1, auto';
}
const CYCLE = [cur(C0), cur(C0), cur(C0), cur(C1)]; // моргает раз в ~0.7 сек
const HIT = cur(C2);
const droot = document.documentElement;
let cIdx = 0, hitting = false;
function paintCur(){ droot.style.setProperty("--dcur", hitting ? HIT : CYCLE[cIdx]); }
paintCur();
setInterval(() => { cIdx = (cIdx + 1) % CYCLE.length; paintCur(); }, 180);
document.addEventListener("pointerdown", () => { hitting = true; paintCur(); });
document.addEventListener("pointerup", () => { hitting = false; paintCur(); });
</script>
</body>
</html>
